<!DOCTYPE html>
<html>
<head>
  <title>ProfitPlus Icon Generator</title>
  <style>
    body {
      background: #0d0520;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px;
      font-family: sans-serif;
      color: white;
    }
    button {
      background: #00ff88;
      color: #020617;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    canvas { border-radius: 22px; }
    .pair { display: flex; gap: 20px; align-items: center; }
  </style>
</head>
<body>
  <h2>ProfitPlus Icon Generator</h2>
  <p>Click each button to download the icon</p>

  <div class="pair">
    <canvas id="c192" width="192" height="192"></canvas>
    <button onclick="download('c192', 'icon-192.png')">Download icon-192.png</button>
  </div>

  <div class="pair">
    <canvas id="c512" width="512" height="512"></canvas>
    <button onclick="download('c512', 'icon-512.png')">Download icon-512.png</button>
  </div>

  <script>
    function drawIcon(canvas) {
      const s = canvas.width
      const ctx = canvas.getContext('2d')
      const r = s * 0.22

      // Background
      const bgGrad = ctx.createLinearGradient(0, 0, s, s)
      bgGrad.addColorStop(0, '#1a0a35')
      bgGrad.addColorStop(1, '#0d0520')

      ctx.beginPath()
      ctx.moveTo(r, 0)
      ctx.lineTo(s - r, 0)
      ctx.quadraticCurveTo(s, 0, s, r)
      ctx.lineTo(s, s - r)
      ctx.quadraticCurveTo(s, s, s - r, s)
      ctx.lineTo(r, s)
      ctx.quadraticCurveTo(0, s, 0, s - r)
      ctx.lineTo(0, r)
      ctx.quadraticCurveTo(0, 0, r, 0)
      ctx.closePath()
      ctx.fillStyle = bgGrad
      ctx.fill()

      // Border glow
      ctx.strokeStyle = 'rgba(0,255,136,0.25)'
      ctx.lineWidth = s * 0.015
      ctx.stroke()

      // Points for trend line
      const pts = [
        [0.14, 0.73],
        [0.30, 0.52],
        [0.46, 0.60],
        [0.63, 0.34],
        [0.78, 0.20],
      ]

      const lineGrad = ctx.createLinearGradient(0, s, s, 0)
      lineGrad.addColorStop(0, '#00cc6a')
      lineGrad.addColorStop(1, '#00ff88')

      // Glow shadow
      ctx.shadowColor = '#00ff88'
      ctx.shadowBlur = s * 0.06

      ctx.beginPath()
      ctx.strokeStyle = lineGrad
      ctx.lineWidth = s * 0.07
      ctx.lineCap = 'round'
      ctx.lineJoin = 'round'
      ctx.moveTo(pts[0][0] * s, pts[0][1] * s)
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i][0] * s, pts[i][1] * s)
      }
      ctx.stroke()

      // Arrow tip
      ctx.beginPath()
      ctx.moveTo(0.69 * s, 0.20 * s)
      ctx.lineTo(0.78 * s, 0.20 * s)
      ctx.lineTo(0.78 * s, 0.29 * s)
      ctx.stroke()

      // Dots
      [[0.14, 0.73, 0.045], [0.78, 0.20, 0.05]].forEach(([x, y, r]) => {
        ctx.beginPath()
        ctx.arc(x * s, y * s, r * s, 0, Math.PI * 2)
        ctx.fillStyle = '#00ff88'
        ctx.fill()
      })

      // Baseline
      ctx.shadowBlur = 0
      ctx.beginPath()
      ctx.strokeStyle = 'rgba(0,255,136,0.15)'
      ctx.lineWidth = s * 0.015
      ctx.moveTo(0.12 * s, 0.82 * s)
      ctx.lineTo(0.88 * s, 0.82 * s)
      ctx.stroke()
    }

    function download(id, filename) {
      const canvas = document.getElementById(id)
      const link = document.createElement('a')
      link.download = filename
      link.href = canvas.toDataURL('image/png')
      link.click()
    }

    drawIcon(document.getElementById('c192'))
    drawIcon(document.getElementById('c512'))
  </script>
</body>
</html>
