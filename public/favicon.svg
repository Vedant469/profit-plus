<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a35"/>
      <stop offset="100%" stop-color="#0d0520"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00cc6a"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle green border -->
  <rect width="100" height="100" rx="22" fill="none"
    stroke="rgba(0,255,136,0.25)" stroke-width="1.5"/>

  <!-- Inner glow -->
  <rect x="2" y="2" width="96" height="96" rx="21" fill="none"
    stroke="rgba(0,255,136,0.08)" stroke-width="3"/>

  <!-- Profit chart line -->
  <polyline
    points="14,73 30,52 46,60 63,34 78,20"
    fill="none"
    stroke="url(#line)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrow tip -->
  <polyline
    points="69,20 78,20 78,29"
    fill="none"
    stroke="url(#line)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Glow dots -->
  <circle cx="14" cy="73" r="4.5" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="46" cy="60" r="3" fill="#00ff88" opacity="0.6"/>
  <circle cx="63" cy="34" r="3" fill="#00ff88" opacity="0.6"/>
  <circle cx="78" cy="20" r="5" fill="#00ff88" filter="url(#glow)"/>

  <!-- Bottom baseline -->
  <line x1="12" y1="82" x2="88" y2="82"
    stroke="rgba(0,255,136,0.15)" stroke-width="1.5"
    stroke-linecap="round"/>
</svg>